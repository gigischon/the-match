<!DOCTYPE html>
<html lang="en">
<head>

<title>The Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #EEF2F6; --surface: #FFFFFF; --ink: #0F1B2D; --muted: #526074; --line: #D2DAE4;
  --accent: #2457C5; --accent-ink: #FFFFFF; --accent-soft: #DDE7FA;
  --gold: #8A5F0E; --gold-soft: #F6ECD3;
  --ok: #1F7A4D; --ok-soft: #DDF1E6;
  --hold: #5B6781; --hold-soft: #E8EBF1;
  --bad: #A6372F; --bad-soft: #F8E1DE;
  --display: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1522; --surface: #18202F; --ink: #E8ECF4; --muted: #9AA6BD; --line: #2B3548;
    --accent: #7FA8F0; --accent-ink: #0F1522; --accent-soft: #1F2C47;
    --gold: #E0B659; --gold-soft: #3A3018;
    --ok: #6CCB98; --ok-soft: #173326;
    --hold: #9AA6BD; --hold-soft: #252E40;
    --bad: #F0918A; --bad-soft: #3D1F1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0F1522; --surface: #18202F; --ink: #E8ECF4; --muted: #9AA6BD; --line: #2B3548;
    --accent: #7FA8F0; --accent-ink: #0F1522; --accent-soft: #1F2C47;
    --gold: #E0B659; --gold-soft: #3A3018;
    --ok: #6CCB98; --ok-soft: #173326;
    --hold: #9AA6BD; --hold-soft: #252E40;
    --bad: #F0918A; --bad-soft: #3D1F1C;
    color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.45; }
.wrap { max-width: 720px; margin-inline: auto; padding-left: 16px; padding-right: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { position: sticky; top: 0; z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.topin { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.topin span { color: var(--muted); font-size: .9rem; }
.topin div { display: flex; align-items: center; gap: 10px; }
.note { margin-top: 12px; }
.note > div { background: var(--gold-soft); color: var(--gold); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
main { padding-block: 16px 110px; }
section { display: flex; flex-direction: column; gap: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools > * { min-width: 0; }
.tools input[type="search"] { flex: 1 1 100%; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="password"], input[type="email"], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 84px; resize: vertical; }
input[type="file"] { max-width: 100%; }
.tools select { width: auto; flex: 1 1 140px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 10px 14px; min-height: 44px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
.topin { padding-block: 18px 16px; }
.topin h1 { font-size: 2rem; letter-spacing: -.02em; line-height: 1.1; }
.topin div { gap: 12px; }
#sync:empty { display: none; }
.btn.small.round { width: 36px; padding: 0; border-radius: 50%; font-size: 1.2rem; line-height: 1; }
.topin div { flex-wrap: wrap; justify-content: flex-end; gap: 12px; }
.btn:disabled { opacity: .55; cursor: default; }
#singlesList { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
#singlesList .day, #singlesList .empty { grid-column: 1 / -1; }
.tile { display: flex; flex-direction: column; padding: 0; overflow: hidden; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; min-width: 0; }
.tile .av { width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 0; font-size: 2.4rem; }
.tile .tb { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; min-width: 0; }
.tile .nm { font-family: var(--display); font-weight: 700; font-size: 1rem; overflow-wrap: anywhere; }
.tile .sub { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.day { margin-top: 10px; padding-bottom: 4px; border-bottom: 2px solid var(--line); font-size: 1.05rem; }
.count { color: var(--muted); font-size: .9rem; }
.list { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips .lbl { color: var(--muted); font-size: .9rem; flex: 1 1 100%; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; min-height: 42px; cursor: pointer; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.import { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; font-size: .82rem; max-width: 360px; margin-left: auto; }
.import strong { font-size: .82rem; font-weight: 600; }
.import .msg { font-size: .76rem; margin: 0; }
.import input[type=file] { font-size: .78rem; }
.photofld > span { font-size: 1.05rem; font-weight: 600; }
.photofld input[type=file] { font-size: 1rem; }
.rb { flex: 1; min-width: 0; }
.av { flex: none; width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--hold-soft); }
.av.ph { display: inline-flex; align-items: center; justify-content: center; color: var(--hold); font-weight: 700; font-family: var(--display); font-size: 1.1rem; }
.av.lg { width: 132px; height: 132px; border-radius: 14px; }
.av.ph.lg { font-size: 2.2rem; }
.hero { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.hero .rb { display: flex; flex-direction: column; gap: 8px; }
.photoedit { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.photoedit > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 180px; }
.row { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.row .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.row .nm { font-family: var(--display); font-weight: 700; font-size: 1.1rem; min-width: 0; overflow-wrap: anywhere; }
.row .sub { color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
.row .why { margin-top: 6px; overflow-wrap: anywhere; }
.row .concern { margin-top: 4px; color: var(--gold); overflow-wrap: anywhere; }
.pill { display: inline-block; white-space: nowrap; border-radius: 999px; padding: 2px 10px; font-size: .8rem; font-weight: 700; background: var(--hold-soft); color: var(--hold); }
.pill.available, .pill.suggested, .pill.yes { background: var(--ok-soft); color: var(--ok); }
.pill.busy, .pill.dating, .pill.middle, .pill.checking { background: var(--accent-soft); color: var(--accent); }
.pill.engaged, .pill.married { background: var(--gold-soft); color: var(--gold); }
.pill.ended, .pill.closed { background: var(--bad-soft); color: var(--bad); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 22px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.block { background: var(--gold-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.block h3 { color: var(--gold); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { color: var(--muted); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding: 0 16px env(safe-area-inset-bottom, 0px); }
.tabs div { max-width: 720px; margin-inline: auto; display: flex; }
.tabs button { flex: 1; white-space: nowrap; border: 0; background: transparent; padding: 14px 4px; min-height: 56px; cursor: pointer; color: var(--muted); font-weight: 600; border-top: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
.tabs button { font-size: .92rem; white-space: nowrap; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.page { display: block; width: 100%; height: auto; background: #FFFFFF; border: 1px solid var(--line); border-radius: 6px; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 20, .93); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; background: #FFFFFF; }
.lightbox .btn { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; }
.hero img.av { cursor: zoom-in; }
.topin { flex-wrap: wrap; }
#sync { min-width: 4.2em; }
.badge { display: inline-block; min-width: 20px; margin-left: 6px; border-radius: 999px; background: var(--gold); color: var(--surface); font-size: .75rem; padding: 1px 6px; }
.sheet, .gate { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; }
.gate { z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.gate .card { width: 100%; max-width: 380px; gap: 14px; }
.sheetbar { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheetbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.sheetbar h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#sheetBody { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; }
form { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld > span { font-weight: 600; font-size: .92rem; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair > * { min-width: 0; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.radios { display: flex; gap: 20px; }
dl { margin: 0; display: grid; grid-template-columns: minmax(96px, 30%) 1fr; gap: 8px 12px; }
dt { color: var(--muted); font-size: .92rem; }
dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 10px 16px; max-width: calc(100% - 32px); }
#statusFilter { display: none; }   /* the Any status box does this job, so the extra row of status buttons is not shown */
/* The opening screen: the icon's design fills the screen for a moment, then fades away to the app or the sign-in. */
.splash { position: fixed; inset: 0; z-index: 100; background: #1E2D50; color: #F7F3EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: opacity .5s ease; }
.splash.gone { opacity: 0; pointer-events: none; }
.sp-mark { width: min(64vw, 320px); height: auto; margin-bottom: 26px; }
.sp-the { font-family: Georgia, "Times New Roman", serif; font-size: 2.7rem; line-height: 1; }
.sp-name { font-family: Georgia, "Times New Roman", serif; font-size: 5.4rem; line-height: 1.05; }
.gate-logo { background: #1E2D50; color: #F7F3EC; border-radius: 10px; padding: 18px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.gate-logo .sp-mark { width: 84px; margin-bottom: 8px; }
.gate-logo .sp-the { font-size: 1rem; }
.gate-logo .sp-name { font-size: 2rem; }
.topin h1 { display: flex; align-items: center; gap: 10px; }
/* The top bar wears the icon's colors: navy, with the name in the same off-white lettering. */
.top { background: #1E2D50; border-bottom-color: #1E2D50; }
.topin h1 { color: #F7F3EC; font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: 0; }
.topin .btn { background: transparent; border-color: rgba(247, 243, 236, .45); color: #F7F3EC; }
.topin span { color: #C9B487; }
.topin h1 .mark { width: 1.25em; height: auto; flex: none; }
@media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
/* Settings rows: one line each, opened by a tap. */
.card.set, .sheet .card.set, #sheetBody .card.set { padding: 0; margin: 0 0 6px; }
.set > summary { padding: 9px 12px; font-weight: 600; font-size: .9rem; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.set > summary::-webkit-details-marker { display: none; }
.set > summary::after { content: "\203A"; font-size: 1.2rem; line-height: 1; color: var(--muted); transition: transform .15s ease; }
.set[open] > summary::after { transform: rotate(90deg); }
#sheetBody .card.set[open] { padding-bottom: 10px; }
.set > :not(summary) { margin-left: 12px; margin-right: 12px; font-size: .9rem; }
/* Phone: everything a little smaller, the top on one line, and each row of options on one line (the long Group row slides sideways). */
@media (max-width: 520px) {
  html { font-size: 93.75%; }
  input, select, textarea { font-size: 16px; }   /* an iPhone zooms the page when a box with smaller letters is tapped */
  .topin { flex-wrap: nowrap; padding-block: 10px; gap: 8px; }
  .topin h1 { font-size: 1.5rem; white-space: nowrap; }
  .topin div { width: auto; flex-wrap: nowrap; gap: 6px; }
  .btn.small { min-height: 32px; padding: 4px 9px; font-size: .82rem; }
  .btn.small.round { width: 32px; font-size: 1.05rem; }
  #sync { display: none; }
  main { padding-block: 10px 100px; }
  #p-singles { gap: 8px; }
  #p-singles .tools { flex-wrap: nowrap; }
  #p-singles > .tools:first-child input[type="search"] { order: 1; flex: 1 1 50%; min-width: 0; }
  #p-singles > .tools:first-child #addSingle { order: 2; }
  #p-singles > .tools:first-child .seg { order: 3; }
  #p-singles > .tools:first-child select { order: 4; flex: 1 1 110px; width: auto; min-height: 40px; padding: 6px 8px; }
  #p-singles .tools .seg { flex: 1 1 auto; }
  #p-singles .tools .seg button { flex: 1; padding: 8px 6px; min-height: 40px; white-space: nowrap; }
  #p-singles .tools .btn { flex: none; min-height: 40px; padding: 8px 12px; white-space: nowrap; }
  #p-singles .tools input[type="search"] { min-height: 40px; padding: 8px 12px; }
  #p-singles > .tools:first-child { flex-wrap: wrap; }
  #p-singles .chips { position: relative; flex-wrap: nowrap; overflow-x: auto; gap: 5px; padding-top: 17px; scrollbar-width: none; }
  #p-singles .chips::-webkit-scrollbar { display: none; }
  #p-singles .chips .lbl { position: absolute; top: 0; left: 0; flex: none; font-size: .76rem; }
  #p-singles .chip { flex: none; padding: 5px 8px; min-height: 32px; font-size: .84rem; white-space: nowrap; }
  #p-singles #groupFilter { flex-wrap: wrap; overflow-x: visible; }   /* the group names are long, so they sit in two neat rows instead of sliding sideways */
  #p-singles #groupFilter .chip { padding: 5px 7px; font-size: .82rem; }
}
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true"><svg class="sp-mark" viewBox="298 220 428 280" aria-hidden="true"><path d="M328 490V360a120 120 0 0 1 240 0v130" fill="none" stroke="#C9B487" stroke-width="20"/><path d="M456 490V360a120 120 0 0 1 240 0v130" fill="none" stroke="#F7F3EC" stroke-width="20"/></svg><div class="sp-the">The</div><div class="sp-name">Match</div></div>
<header class="top"><div class="wrap topin"><h1><svg class="mark" viewBox="298 220 428 280" aria-hidden="true"><path d="M328 490V360a120 120 0 0 1 240 0v130" fill="none" stroke="#C9B487" stroke-width="20"/><path d="M456 490V360a120 120 0 0 1 240 0v130" fill="none" stroke="currentColor" stroke-width="20"/></svg>The Match</h1><div><span id="summary" hidden></span><span id="sync" role="status"></span><button type="button" id="night" aria-pressed="false" hidden>Night</button><button type="button" class="btn small round" id="refresh" aria-label="Refresh" title="Refresh">&#8635;</button><button type="button" class="btn small" id="list">List</button><button type="button" class="btn small" id="acct">Account</button><button type="button" class="btn small round" id="settings" aria-label="Settings" title="Settings">&#9881;&#65038;</button></div></div></header>
<div id="note" class="wrap note" hidden><div id="noteText"></div></div>
<div id="update" class="wrap note" hidden><div>A newer version of The Match is ready. <a id="updateGo" target="_top" href="#">Tap here to update</a></div></div>

<main class="wrap">
  <section id="p-singles">
    <div class="tools">
      <input id="q" type="search" placeholder="Search name, city or yeshiva" aria-label="Search singles">
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-g="m" aria-pressed="true">Boys</button>
        <button type="button" data-g="f" aria-pressed="false">Girls</button>
      </div>
      <select id="fStatus" aria-label="Status">
        <option value="">Any status</option>
        <option value="available">Single</option>
        <option value="busy">Dating</option>
        <option value="hold">On hold</option>
        <option value="engaged">Engaged</option>
        <option value="closed">Closed</option>
      </select>
      <button type="button" class="btn primary" id="addSingle">Add single</button>
    </div>
    <div class="chips" id="statusFilter" role="group" aria-label="Status"></div>
    <div class="chips" id="learnFilter" role="group" aria-label="Years of learning"></div>
    <div class="chips" id="groupFilter" role="group" aria-label="Group"></div>
    <p id="singlesCount" class="count"></p>
    <div id="singlesList" class="list"></div>
    <div id="testTools" class="acts"></div>
  </section>

  <section id="p-matches" hidden>
    <div id="due"></div>
    <div class="tools">
      <select id="fStage" aria-label="Stage">
        <option value="open">In progress</option>
        <option value="">All stages</option>
        <option value="idea">Idea</option>
        <option value="suggested">Suggested</option>
        <option value="checking">Looking into it</option>
        <option value="yes">Gave a yes</option>
        <option value="dating">Dating</option>
        <option value="middle">Dating, with the number of dates</option>
        <option value="ended">Ended</option>
        <option value="engaged">Engaged</option>
      </select>
      <button type="button" class="btn primary" id="addMatch">New shidduch</button>
    </div>
    <div id="matchList" class="list"></div>
  </section>

  <section id="p-mine" hidden>
    <div class="tools"><input id="mineQ" type="search" placeholder="Search my ideas by name" aria-label="Search my ideas"><button type="button" class="btn primary" id="addIdea">Add an idea</button></div>
    <div id="mineList" class="list"></div>
  </section>

  <section id="p-ideas" hidden>
    <label class="fld"><span>Who needs a shidduch idea?</span><select id="ideaFor"></select></label>
    <div class="acts"><button type="button" class="btn primary" id="ideaGo">Suggest matches</button></div>
    <p id="ideaMsg" class="msg">Pick a person and tap Suggest matches. Suggestions compare age, hashkafa, background and location, and skip anyone already tried.</p>
    <div id="ideaList" class="list"></div>
  </section>
</main>

<nav class="tabs" aria-label="Sections"><div>
  <button type="button" data-tab="singles" aria-current="page">Singles</button>
  <button type="button" data-tab="matches">Shidduchim<span id="dueBadge" class="badge" hidden></span></button>
  <button type="button" data-tab="mine">My ideas</button>
  <button type="button" data-tab="ideas">Suggest</button>
</div></nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheetbar"><div class="wrap"><button type="button" class="btn" id="sheetBack">Back</button><h2 id="sheetTitle"></h2></div></div>
  <div id="sheetBody" class="wrap"></div>
</div>

<div id="gate" class="gate" hidden>
  <form class="card" id="gateForm" novalidate>

      "test-07": portrait("f", "#E3ECF5", "#EFC6A4", "#2A1D16", "#6B3F5B", "", 0, ""), "test-08": portrait("f", "#EAF1DF", "#F0C9A8", "#7A4B26", "#2F5D50", "", 0, ""),
      "test-09": portrait("f", "#F4EBD6", "#F3D3B8", "#A0522D", "#3D3A6B", "", 0, ""), "test-10": portrait("f", "#E8E2F2", "#DDAE86", "#17110D", "#7A2E3A", "", 0, ""),
      "test-11": portrait("m", "#E1EAF3", "#F1CBAA", "#2E211A", "#1F2937", "hat", 0, ""), "test-12": portrait("m", "#EFE9DB", "#EBC3A0", "#4B3323", "#33475B", "kippah", 0, "#1B1B1F"),
      "test-13": portrait("m", "#E4F0E6", "#F0C9A8", "#7A4B26", "#1F2937", "hat", 1, ""), "test-14": portrait("m", "#ECE4F1", "#E6BB98", "#3A3A3A", "#2B3A55", "kippah", 1, "#3B2F2F"),
      "test-15": portrait("m", "#F1E6E0", "#EFC6A4", "#241A14", "#1F2937", "hat", 1, ""), "test-16": portrait("f", "#E6EEF6", "#F3D3B8", "#3B2618", "#31506B", "", 0, ""),
      "test-17": portrait("f", "#F3ECDD", "#F0C9A8", "#8A5A2B", "#5B3A5E", "", 0, ""), "test-18": portrait("f", "#E5F0EA", "#EFC6A4", "#5A3D28", "#2F5D50", "", 0, ""),
      "test-19": portrait("f", "#EFE5EE", "#EBC3A0", "#1E1612", "#44406E", "", 0, ""), "test-20": portrait("f", "#F5E9DF", "#F2CFB2", "#6B3F22", "#7A2E3A", "", 0, "")
    };
    var resumes = {};
    people.forEach(function (p) {
      resumes[p.id] = btoa(testPdf([p.name.replace(/^TEST /, ""), "Shidduch Resume  (TEST - not a real person)", "",
        "Date of birth: " + (p.dob || "not given") + (p.age ? "     Age: " + p.age : ""), "Height: " + p.height, "Address: " + p.city, "",
        "Hashkafa: " + p.hashkafa, "Background: " + p.background, "", "Family: " + p.family, "",
        "Education: " + p.education, "Currently: " + p.occupation, "", "Looking for: " + p.lookingFor, "",

    });
    work(call("bulk", { singles: people, matches: pairs, photos: pics, resumes: resumes }), btn).then(function (r) { singles = r.data.singles; matches = r.data.matches; photos = r.photos || photos; render(); }).catch(function () {});
  }

  /* ---------- wiring ---------- */
  function setTab(t) {
    ["singles", "matches", "mine", "ideas"].forEach(function (x) { $("p-" + x).hidden = x !== t; });
    document.querySelectorAll(".tabs button").forEach(function (b) { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tabs button").forEach(function (b) { b.addEventListener("click", function () { setTab(b.dataset.tab); }); });
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      gFilter = b.dataset.g;
      document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      renderSingles();
    });
  });
  $("lightbox").addEventListener("click", function () { $("lightbox").hidden = true; $("lightImg").removeAttribute("src"); });
  $("q").addEventListener("input", renderSingles);
  $("mineQ").addEventListener("input", renderMine);
  $("fStatus").addEventListener("change", function () { renderStatusFilter(); renderSingles(); });
  $("fStage").addEventListener("change", renderMatches);
  $("addSingle").addEventListener("click", function () { if (loaded) openSingleForm(null); });
  $("addIdea").addEventListener("click", function () { if (loaded) openMatchForm(null, null, "idea"); });
  $("addMatch").addEventListener("click", function () { if (loaded) openMatchForm(null); });
  $("sheetBack").addEventListener("click", function () { if (sheet && sheet.type === "list" && sheet.id && bigList.text) showList(bigList.text); else if (sheet && (sheet.type === "single" || sheet.type === "resume") && sheet.id) openDetail(sheet.id); else closeSheet(); });
  $("ideaGo").addEventListener("click", runIdeas);
  $("ideaFor").addEventListener("change", function () { ideas = null; renderIdeas(); });
  /* The name at the top is the way home: back to the opening view (Singles, Boys, nothing searched or filtered) and a
     quiet refresh. It does nothing while a form is being filled in, so typing is never lost. */
  function goHome() {
    if (!PASS || !loaded) return;
    if (sheet && sheet.type !== "detail" && sheet.type !== "settings" && sheet.type !== "account" && sheet.type !== "list") return;
    closeSheet(); $("lightbox").hidden = true; $("lightImg").removeAttribute("src");
    gFilter = "m";
    document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.g === "m" ? "true" : "false"); });
    $("q").value = ""; $("mineQ").value = ""; moreQ = ""; $("fStatus").selectedIndex = 0; $("fStage").selectedIndex = 0;
    learnSel = []; groupSel = [];
    renderLearnFilter(); renderGroupFilter(); renderStatusFilter();
    setTab("singles"); render();
    if (!busy) loadAll(true);
  }
  var homeBtn = document.querySelector(".topin h1");
  homeBtn.setAttribute("role", "button"); homeBtn.setAttribute("tabindex", "0"); homeBtn.setAttribute("aria-label", "The Match, back to the start"); homeBtn.style.cursor = "pointer";
  homeBtn.addEventListener("click", goHome);
  homeBtn.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goHome(); } });
  $("refresh").addEventListener("click", function () { if (!busy && PASS) loadAll(); });
  $("acct").addEventListener("click", function () { if (PASS) openAccount(); });
  $("list").addEventListener("click", function () { if (PASS && loaded) openList(); });
  $("settings").addEventListener("click", function () { if (PASS) openSettings(); });


  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && LIVE && PASS && !newer) send({ action: "status" }).then(function (r) { checkBuild(r.build); }, function () {});
    var editing = sheet && sheet.type !== "detail";
    if (!document.hidden && PASS && loaded && !busy && !pending && !editing && Date.now() - lastLoad > 60000) loadAll(true);
  });

  /* ---------- start ---------- */
  if (REMOTE) send({ action: "status" }).then(function (r) { checkBuild(r.build); }, function () {});   // even the sign-in screen moves to a newer copy by itself
  renderLearnFilter();
  renderGroupFilter();
  renderStatusFilter();
  if (!LIVE) { PASS = "preview"; ME = "preview"; loadAll(); }
  else {
    var saved = /^[a-f0-9]{64}$/.test(URLKEY) ? URLKEY : "";   // opened from a saved private link
    if (!saved) { try { saved = localStorage.getItem(KEEP) || ""; } catch (e) {} }
    if (!saved) showGate("in");
    else {
      PASS = saved;
      var boot = null;
      try { boot = JSON.parse($("boot").textContent); } catch (e) {}
      loadAll(false, boot && boot.ok && boot.data && saved === URLKEY ? boot : null);
    }

  }
})();
</script>
